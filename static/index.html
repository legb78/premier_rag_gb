<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon premier RAG</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="chat">
        <header class="chat-header">
            <div class="chat-title">
                <span class="dot"></span>
                Mon premier RAG
            </div>
            <span class="chat-subtitle">Assistant sur la base de connaissances</span>
        </header>

        <div id="messages" class="messages">
            <div class="message bot">
                <div class="bubble">
                    Bonjour ! Pose-moi une question sur la base de connaissances.
                    Par exemple : « Quelle est la couleur du chat de Bob ? »
                </div>
            </div>
        </div>

        <form id="ask-form" class="composer">
            <input
                id="question"
                type="text"
                placeholder="Écris ta question…"
                autocomplete="off"
                required
            />
            <button type="submit" id="send-btn" aria-label="Envoyer">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                    <path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/>
                </svg>
            </button>
        </form>
    </div>

    <script>
        const form = document.getElementById("ask-form");
        const input = document.getElementById("question");
        const messages = document.getElementById("messages");
        const sendBtn = document.getElementById("send-btn");

        function addMessage(text, who) {
            const wrap = document.createElement("div");
            wrap.className = "message " + who;
            const bubble = document.createElement("div");
            bubble.className = "bubble";
            bubble.textContent = text;
            wrap.appendChild(bubble);
            messages.appendChild(wrap);
            messages.scrollTop = messages.scrollHeight;
            return bubble;
        }

        function addTyping() {
            const wrap = document.createElement("div");
            wrap.className = "message bot";
            wrap.innerHTML =
                '<div class="bubble typing"><span></span><span></span><span></span></div>';
            messages.appendChild(wrap);
            messages.scrollTop = messages.scrollHeight;
            return wrap;
        }

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            const question = input.value.trim();
            if (!question) return;

            addMessage(question, "user");
            input.value = "";
            input.disabled = true;
            sendBtn.disabled = true;
            const typing = addTyping();

            try {
                const res = await fetch("/ask", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ question }),
                });
                if (!res.ok) throw new Error("Erreur serveur (" + res.status + ")");
                const data = await res.json();
                typing.remove();
                addMessage(data.answer, "bot");
            } catch (err) {
                typing.remove();
                const b = addMessage("Une erreur est survenue : " + err.message, "bot");
                b.classList.add("error");
            } finally {
                input.disabled = false;
                sendBtn.disabled = false;
                input.focus();
            }
        });
    </script>
</body>
</html>
